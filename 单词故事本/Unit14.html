<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>单词故事本 · Unit 14</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C8643B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="单词故事本">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F4EBE0'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23C8643B'/%3E%3Ccircle cx='20.5' cy='12.5' r='7.5' fill='%23F4EBE0'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{
  --paper:#F4EBE0;--card:#FFFBF6;--ink:#2B2622;--ink2:#6B6156;--ink3:#9A8E80;
  --clay:#C8643B;--clay2:#A9542F;--moon:#E8B84B;--line:rgba(43,38,34,.13);
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(43,38,34,.04) 1px,transparent 1px);background-size:22px 22px}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:26px 18px 130px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:25px;font-weight:700;margin:0;letter-spacing:.02em}
.brand p{margin:6px 0 0;font-size:12.5px;color:var(--ink2)}
.badge{font-size:12px;color:var(--clay2);border:1px dashed rgba(200,100,59,.45);border-radius:999px;padding:6px 14px;background:rgba(255,251,246,.75)}
.home-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--clay2);background:rgba(200,100,59,.1);border-radius:999px;padding:4px 10px;font-weight:600;transition:.15s;text-decoration:none}
.home-link:hover{background:var(--clay);color:#fff}
.unit-nav{display:flex;align-items:center;gap:6px}
.ubtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s;font-weight:600;text-decoration:none}
.ubtn:hover{border-color:var(--clay);color:var(--clay2)}
.ubtn.badge-btn{background:rgba(255,251,246,.9);color:var(--clay2);border-color:rgba(200,100,59,.45)}
.umodal{position:fixed;inset:0;z-index:90;background:rgba(43,38,34,.48);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.umodal.on{opacity:1;pointer-events:auto}
.umodal-card{background:#FFFDF9;border-radius:24px;padding:26px 28px;max-width:800px;width:100%;max-height:85vh;overflow:auto;
  border:1px solid rgba(200,100,59,.2);box-shadow:0 24px 60px -12px rgba(43,38,34,.28),0 0 0 1px rgba(255,255,255,.8) inset;
  transform:scale(.94) translateY(12px);transition:transform .24s cubic-bezier(.16,1,.3,1)}
.umodal.on .umodal-card{transform:scale(1) translateY(0)}

.umodal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px dashed rgba(43,38,34,.12)}
.umodal-head h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--clay2);display:flex;align-items:center;gap:8px}

.modal-close-btn{width:32px;height:32px;border-radius:50%;background:rgba(43,38,34,.06);border:1px solid rgba(43,38,34,.1);
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);font-size:14px;cursor:pointer;transition:all .2s ease}
.modal-close-btn:hover{background:rgba(200,100,59,.12);color:var(--clay2);border-color:rgba(200,100,59,.3);transform:rotate(90deg)}

.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.uitem{background:#FFFDF9;border:1px solid rgba(43,38,34,.1);border-radius:14px;padding:14px 16px;display:block;text-align:left;
  transition:all .2s cubic-bezier(.16,1,.3,1);text-decoration:none}
.uitem:hover{border-color:var(--clay);background:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,100,59,.12)}
.uitem.on{border:2px solid var(--clay);background:rgba(200,100,59,.06);box-shadow:0 4px 12px rgba(200,100,59,.15)}
.uitem b{display:block;font-family:var(--serif);font-size:16.5px;color:var(--clay2)}
.uitem span{display:block;font-size:11px;color:var(--ink3);margin-top:4px}

.opt-group{background:rgba(255,251,246,.7);border:1px solid rgba(43,38,34,.08);border-radius:16px;padding:16px}
.opt-label{display:block;font-size:12px;font-weight:700;color:var(--clay2);letter-spacing:.05em;margin-bottom:12px}

.layout-toggle{display:flex;background:rgba(43,38,34,.06);border-radius:12px;padding:4px;gap:4px;border:1px solid rgba(43,38,34,.08);width:100%}
.lbtn{flex:1;border:none;background:transparent;padding:9px 14px;font-size:13px;color:var(--ink2);cursor:pointer;
  transition:all .2s cubic-bezier(.16,1,.3,1);font-weight:500;font-family:var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px}
.lbtn.on{background:#ffffff;color:var(--clay2);font-weight:700;box-shadow:0 3px 10px rgba(43,38,34,.1)}

.audiobar{display:flex;flex-direction:column;gap:12px;width:100%}
.arow{display:flex;align-items:center;gap:12px}
.alabel{flex:0 0 42px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.aseg{display:flex;background:rgba(43,38,34,.06);border-radius:10px;padding:3px;gap:3px;border:none}
.aseg button{border:none;background:transparent;padding:7px 10px;font-size:12.5px;color:var(--ink2);font-weight:500;
  border-radius:7px;transition:all .18s ease;cursor:pointer;text-align:center}
.aseg button:hover{color:var(--clay2)}
.aseg button.on{background:#ffffff;color:var(--clay2);font-weight:700;box-shadow:0 2px 6px rgba(43,38,34,.12)}
.aseg.wide{flex:1;min-width:0}
.aseg.wide button{flex:1;padding:6px 4px;line-height:1.25}
.aseg.wide button small{display:block;font-size:9.8px;opacity:.65;font-weight:400;margin-top:1px}
.aseg.wide button.on small{opacity:.9}

#preven{border:1px solid rgba(200,100,59,.35);background:rgba(200,100,59,.08);color:var(--clay2);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;flex:0 0 auto}
#preven:hover{background:var(--clay);color:#fff;border-color:var(--clay)}

.stickyhead{position:sticky;top:0;z-index:30;background:var(--paper);padding:12px 18px 10px;margin:0 -18px 10px;
  border-bottom:1px solid transparent;transition:padding .22s,border-color .22s,background .22s,box-shadow .22s;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.sticky-left{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.tabs{display:flex;gap:5px;flex:1 1 auto;max-width:650px}
.tab{flex:1;border:1px solid var(--line);background:rgba(255,251,246,.85);border-radius:999px;
  padding:8px 4px;font-size:13px;color:var(--ink2);transition:.16s ease;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--clay);color:var(--clay2);background:#fff}
.tab.on{background:var(--clay);color:#fff;border-color:var(--clay);box-shadow:0 2px 8px rgba(200,100,59,.22)}
.tab small{display:block;font-size:10px;opacity:.75;margin-top:1px;font-weight:400}
.tab.on small{opacity:.9}

.sticky-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}

/* 吸顶 MINI 模式：背景玻璃拟态，精致双侧布局 */
.stickyhead.mini{padding:8px 14px;background:rgba(244,235,224,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom-color:var(--line);box-shadow:0 4px 16px rgba(43,38,34,.06)}
.stickyhead.mini .tab{padding:5px 8px;font-size:12.5px;border-radius:999px;flex-direction:row;gap:3px}
.stickyhead.mini .tab small{display:none}

.subtn-badge{border:1px solid rgba(200,100,59,.45);background:rgba(255,251,246,.95);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--clay2);cursor:pointer;transition:.15s;font-weight:600;font-family:var(--sans)}
.subtn-badge:hover{background:#fff;border-color:var(--clay);transform:translateY(-1px)}

.opt-settings-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 9px;font-size:13px;color:var(--ink2);transition:.15s;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.opt-settings-btn:hover{border-color:var(--clay);color:var(--clay2);background:#fff}

.wrap{transition:max-width .3s ease,padding .3s ease}
.grid,.pick,.storycard,.wcard,.flip,.tab{transition:all .25s ease}

/* 📱 手机仿真排版模式 (layout-mobile) */
body.layout-mobile .wrap{max-width:480px;padding-left:12px;padding-right:12px}
body.layout-mobile .stickyhead{padding:10px 12px 6px;margin:0 -12px 8px}
body.layout-mobile .stickyhead.mini{padding:6px 10px}
body.layout-mobile .tabs{gap:3px}
body.layout-mobile .tab{padding:6px 2px;font-size:11.8px}
body.layout-mobile .tab small{display:none}
body.layout-mobile .stickyhead.mini .tab{padding:4px 6px;font-size:11.5px}
body.layout-mobile .subtn-badge{padding:4px 8px;font-size:11px}

@media(max-width:640px){
  .home-text{display:none}
}
@media(max-width:430px){
  .tab{padding:6px 1px;font-size:11px}
  .subtn-badge{padding:4px 7px;font-size:11px}
}

.label{font-size:11px;letter-spacing:.16em;color:var(--clay2);margin:26px 0 10px;font-weight:600}
.label:first-child{margin-top:6px}

.storycard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 30px 26px}
.tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:92px;height:20px;
  background:rgba(232,184,75,.45);border-left:1px dashed rgba(43,38,34,.16);border-right:1px dashed rgba(43,38,34,.16)}
.stitle{font-family:var(--serif);font-size:20px;font-weight:700;margin:0}
.smeta{font-size:12px;color:var(--ink3);margin:7px 0 16px}
.en{font-family:var(--serif);font-size:17.5px;line-height:2.05;margin:0 0 6px}
.zh{font-family:var(--serif);font-size:14.5px;line-height:1.95;color:var(--ink2);
  margin:0 0 22px;padding-left:14px;border-left:2px solid rgba(200,100,59,.3)}
/* 段间虚线只出现在「段与段之间」，不依赖谁排在最后（工具条已挪到正文前） */
.pz{padding-top:0;border-top:none}
.pz+.pz{border-top:1px dashed var(--line);padding-top:16px}
.pz .zh{max-height:0;opacity:0;overflow:hidden;margin:0;transition:max-height .3s,opacity .25s,margin .3s}
.pz.open .zh{max-height:400px;opacity:1;margin:8px 0 22px}

.tw{color:var(--clay2);font-weight:600;cursor:pointer;border-radius:3px;padding:0 2px;
  background:linear-gradient(180deg,transparent 56%,rgba(232,184,75,.55) 56%);transition:background .15s}
.tw:hover{background:linear-gradient(180deg,transparent 56%,rgba(232,184,75,.95) 56%)}
.tw.on{background:rgba(232,184,75,.6)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
/* 故事卡内的控制条：排在正文之前，读的时候也够得到 */
.toolbar.top{margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--ink2)}
.btn.on{background:var(--moon);border-color:rgba(200,100,59,.4);color:#5A4410;font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink3);font-size:12px;padding:7px 12px}
.btn.quiet:hover{background:rgba(232,184,75,.34);color:var(--clay2)}

.pick{display:grid;gap:12px}
.pickc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;transition:.16s}
.pickc:hover{border-color:rgba(200,100,59,.45)}
.pickc.on{border:1.5px solid var(--clay);background:#fff}
.pickc b{display:block;font-family:var(--serif);font-size:15px;font-weight:700}
.pickc span{display:block;font-size:11.5px;color:var(--ink3);margin-top:5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;text-align:left;transition:.16s;width:100%;cursor:pointer}
.wcard:hover{border-color:rgba(200,100,59,.45);transform:translateY(-1px)}
.wcard.say{border-color:var(--clay);background:#FFF8EE;box-shadow:0 0 0 2px var(--clay)}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wtop-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wtop b{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--clay2)}
.wtop i{font-style:normal;font-size:11.5px;color:var(--ink3)}
.wtop u{text-decoration:none;font-size:10.5px;color:#8A5A28;background:rgba(232,184,75,.4);border-radius:4px;padding:1px 6px}
.wsense{font-size:12px;color:var(--ink2);margin-top:6px}
.wcoll{font-size:11.5px;color:var(--ink3);margin-top:8px;font-family:var(--sans)}
.wcoll em{font-style:normal;font-family:var(--serif);color:var(--clay2)}

.flip{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:330px;padding:34px 26px 68px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.flip .fword{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:.01em}
.flip .fipa{font-size:14px;color:var(--ink3);margin-top:10px}
.flip .fpos{font-size:11.5px;color:#8A5A28;background:rgba(232,184,75,.45);border-radius:4px;padding:2px 9px;margin-top:12px;display:inline-block}
.reveal{margin-top:22px;border-top:1px dashed var(--line);padding-top:20px;width:100%;max-width:520px}
.rline{display:flex;gap:9px;font-size:13px;line-height:1.75;margin-bottom:7px;text-align:left}
.rline span:first-child{flex:0 0 52px;color:var(--ink3);font-size:12px}
.rline span:last-child{color:var(--ink)}
.rline em{font-style:normal;font-family:var(--serif);color:var(--clay2)}
.hint{font-size:12.5px;color:var(--ink3);margin-top:16px}
/* 卡内页脚：完整考点入口固定在卡片底边 —— 翻面前后位置一致，不随正文长短跳动 */
.cardfoot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:8px 20px 9px;border-top:1px dashed var(--line)}
.cardfoot .more{border:none;background:transparent;border-radius:8px;padding:7px 16px;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;letter-spacing:.02em;color:var(--ink2);transition:.15s}
.cardfoot .more:hover{background:rgba(232,184,75,.42);color:var(--clay2)}
.drillbar{display:flex;gap:8px;margin-top:16px}
.drillbar .btn{flex:1;padding:13px 10px;border-radius:12px;font-size:13.5px}
.b-ok{background:#EAF3DE;border-color:#97C459;color:#27500A}
.b-mid{background:#FAEEDA;border-color:#EF9F27;color:#633806}
.b-no{background:#FCEBEB;border-color:#F09595;color:#791F1F}
/* 词轨：一格 = 一个词，颜色 = 掌握度（灰未背 / 红没记住 / 黄待巩固 / 绿认识）
   点或拖动任意一格 → 跳到那个词。亮色占比本身就是进度 */
.prog{margin-bottom:14px}
/* 自测范围：并到引导语同一行（右边），不额外占一行 ——
   背模式纵向本来就紧，多占 44px 会把三个评分按钮挤出首屏 */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:26px 0 10px}
.dhead:first-child{margin-top:6px}
.dhead .label{margin:0}
.dhead .aseg button{font-size:12px;padding:5px 12px}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.ptop b{color:var(--clay2);font-weight:600;font-variant-numeric:tabular-nums}
.track{position:relative;display:flex;align-items:center;gap:2px;height:17px;border-radius:8px;
  cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.track:focus-visible{outline:2px solid rgba(200,100,59,.5);outline-offset:3px}
.track>i{flex:1;min-width:0;height:7px;border-radius:2px;background:rgba(43,38,34,.13);
  transition:height .12s,background .12s}
.track>i.m2{background:#97C459}
.track>i.m1{background:#EF9F27}
.track>i.m0{background:#F09595}
.track>i.cur{height:13px;box-shadow:0 0 0 1.5px var(--paper),0 0 0 2.5px var(--clay)}
.track .tip{position:absolute;bottom:calc(100% + 7px);transform:translateX(-50%);
  background:var(--clay);color:#FFF7EC;border-radius:8px;padding:3px 10px;font-size:11.5px;
  letter-spacing:.02em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:6}
.track .tip.on{opacity:1}

.pat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.pat .pen{font-family:var(--serif);font-size:15.5px;line-height:1.75;margin:0}
.pat .pzh{font-size:12.5px;color:var(--ink2);margin:7px 0 0}
.pat .pfor{font-size:11px;color:var(--clay2);margin-top:9px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:11.5px;background:rgba(232,184,75,.28);border:1px solid rgba(200,100,59,.22);border-radius:999px;padding:4px 11px;color:#6B4A20;font-family:var(--serif)}

.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:12px 18px;font-size:14px;
  font-family:var(--sans);color:var(--ink);outline:none;margin-bottom:16px}
.search:focus{border-color:rgba(200,100,59,.5)}

/* ---------- 生词本 ----------
   书里的词用「单词」当身份，生词本一律用自生成的 id 当身份，
   所以哪怕收的是同一个词，两边也是两条各自独立的记录。 */
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.vhead .label{margin:0}
.vhead .vc{font-size:12.5px;color:var(--ink2);letter-spacing:.02em}
.vhead .vc b{color:var(--clay2);font-variant-numeric:tabular-nums}
.vrow{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;margin-bottom:9px;text-align:left;transition:.16s}
.vrow:hover{border-color:rgba(200,100,59,.45)}
.vrow .vw{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--clay2);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vrow .vw i{font-style:normal;font-size:12px;color:var(--ink3);font-family:var(--sans);font-weight:400}
.vrow .vw u{text-decoration:none;font-size:10.5px;color:#8A5A28;background:rgba(232,184,75,.45);
  border-radius:4px;padding:1.5px 7px;font-family:var(--sans);font-weight:400}
.vrow .vz{font-family:var(--serif);font-size:13.5px;color:var(--ink);margin-top:5px;line-height:1.65}
.vrow .vn{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.65;
  border-left:2px solid rgba(200,100,59,.3);padding-left:9px}
.vrow .vf{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:nowrap}
.vsrc{font-size:10.5px;color:var(--ink3);letter-spacing:.03em;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vacts{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.vstat{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink3);flex:0 0 auto}
.vstat::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(43,38,34,.16)}
.vstat.m2::before{background:#97C459}
.vstat.m1::before{background:#EF9F27}
.vstat.m0::before{background:#F09595}
.vstat.vo{color:var(--clay)}
.vstat.vo::before{background:var(--clay)}
.vstat.ok::before{background:#97C459}
.vstat:empty::before{display:none}
/* 「待补音频」是个可点的按钮：点一下就地补这一条（服务端不可用时退回导出流程） */
button.vstat{border:1px solid transparent;background:transparent;border-radius:6px;padding:1px 7px;
  font-family:inherit;font-size:10.5px;cursor:pointer;transition:.15s}
button.vstat.vo{border-color:rgba(200,100,59,.38);background:rgba(200,100,59,.09)}
button.vstat.vo:hover{background:rgba(200,100,59,.18)}
button.vstat:not(.vo){cursor:default}
.vstat.busy::before{animation:vpulse .9s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:.3}50%{opacity:1}}
/* 一键补音频：进度条 + 结果 */
.vgn{margin-top:13px}
.vgn .gbar{height:7px;background:rgba(43,38,34,.1);border-radius:99px;overflow:hidden;margin:9px 0 0}
.vgn .gbar>i{display:block;height:100%;width:0;background:var(--clay);border-radius:99px;transition:width .3s}
.vgn .gnum{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:7px;
  display:flex;justify-content:space-between;gap:10px}
.vres{margin-top:11px;font-size:12.5px;line-height:1.9;color:var(--ink2);
  background:rgba(151,196,89,.13);border:1px solid rgba(151,196,89,.3);border-radius:9px;padding:9px 12px}
.vres.bad{background:rgba(200,100,59,.1);border-color:rgba(200,100,59,.3)}
.vres b{color:var(--clay2)}
.gstate{font-size:12.5px;color:var(--ink2);line-height:1.85}
.gstate.warn{color:var(--clay)}
/* 自动可用时，手动方式折起来收在底部 */
.gfold{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.gfold summary{font-size:12.5px;color:var(--ink3);cursor:pointer;list-style:none;padding:2px 0}
.gfold summary::-webkit-details-marker{display:none}
.gfold summary::before{content:"▸ "}
.gfold[open] summary::before{content:"▾ "}
.gfold summary:hover{color:var(--clay)}
.vempty{text-align:center;padding:46px 14px;color:var(--ink3);font-size:13px;line-height:1.95}
.vempty b{display:block;font-family:var(--serif);font-size:17.5px;color:var(--clay2);margin-bottom:7px;font-weight:700}
.vempty .vdrop{justify-content:center}
.vdrop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
/* 生词表单 */
.form{display:flex;flex-direction:column;gap:12px;margin-top:15px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:11.5px;color:var(--ink3);letter-spacing:.05em}
.fld>span em{font-style:normal;color:var(--clay)}
.fld input,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;
  padding:10px 13px;font-size:14px;font-family:var(--sans);color:var(--ink);outline:none;width:100%}
.fld input:focus,.fld textarea:focus{border-color:rgba(200,100,59,.55);background:var(--card)}
.fld textarea{resize:vertical;min-height:64px;line-height:1.65}
.fld.bad input{border-color:var(--clay);background:#FDF3EF}
.vnote{font-size:12.5px;color:var(--ink2);line-height:1.9}
.vnote code{font-family:var(--sans);background:rgba(232,184,75,.35);border-radius:4px;padding:1px 6px}
.vpre{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-family:var(--sans);font-size:11.5px;line-height:1.8;color:var(--ink2);
  max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:12px}

table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:12px;overflow:hidden}
thead th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--clay2);padding:12px 12px;border-bottom:1px solid var(--line);font-weight:600}
tbody td{padding:11px 12px;border-bottom:1px solid rgba(43,38,34,.06);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(232,184,75,.16)}
td.w{font-family:var(--serif);font-weight:700;color:var(--clay2);white-space:nowrap}
td.c{font-family:var(--serif);color:var(--ink2);font-size:12px}

.mask{position:fixed;inset:0;background:rgba(43,38,34,.32);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 20px 30px;max-height:86vh;overflow:auto;transform:translateY(102%);pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.25,1)}
.sheet.on{transform:translateY(0);pointer-events:auto}
.grab{width:42px;height:4px;background:rgba(43,38,34,.18);border-radius:99px;margin:8px auto 16px}
.sh-word{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--clay2);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh-word i{font-style:normal;font-size:13px;color:var(--ink3);font-family:var(--sans)}
.sh-word u{text-decoration:none;font-size:11px;color:#8A5A28;background:rgba(232,184,75,.45);border-radius:4px;padding:2px 8px;font-family:var(--sans)}
.sh-body{margin-top:16px;display:grid;gap:9px}
@media(min-width:780px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:580px;border-radius:16px;max-height:82vh;
    transform:translate(-50%,-48%) scale(.97);opacity:0;transition:transform .24s,opacity .2s}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
}
/* ---------- 朗读 ---------- */
.audiobar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);position:relative;flex-wrap:wrap}
.abtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink2)}
.abtn:hover{border-color:rgba(200,100,59,.45)}
.abtn.on{background:var(--moon);border-color:rgba(200,100,59,.4);color:#5A4410;font-weight:600}
.abtn.stop{background:rgba(43,38,34,.86);color:#FFF7EC;border-color:transparent}
#preven{flex:0 0 auto}
.caret{font-size:9px;opacity:.6;margin-left:2px}
.aseg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.aseg button{border:none;background:transparent;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.aseg button.on{background:var(--clay);color:#fff}
.aseg button+button{border-left:1px solid var(--line)}
.aseg.wide{flex:1;min-width:0}
.aseg.wide button{flex:1;padding:5px 6px;line-height:1.25}
.aseg.wide button small{display:block;font-size:10px;opacity:.72;font-weight:400}
.aseg.wide button.on small{opacity:.85}
.apop{position:absolute;left:0;top:100%;margin-top:8px;z-index:40;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px 13px;box-shadow:0 12px 34px rgba(43,38,34,.16);display:none;width:min(440px,88vw)}
.apop.on{display:block}
.arow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.arow:last-child{margin-bottom:0}
.alabel{flex:0 0 34px;font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.apop select{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;
  font-size:12.5px;color:var(--ink);font-family:var(--sans);outline:none}
.apop select:focus{border-color:rgba(200,100,59,.5)}
.anote{font-size:11.5px;color:var(--ink3);margin-top:11px;line-height:1.7;border-top:1px dashed var(--line);padding-top:10px}
.spk{border:none;background:transparent;border-radius:7px;padding:1px 5px;font-size:12.5px;line-height:1.6;
  color:var(--ink3);vertical-align:baseline;transition:.15s;font-family:var(--sans)}
.spk:hover{background:rgba(232,184,75,.45);color:var(--clay2)}
.spk.ing{background:var(--moon);color:#5A4410}
.sent{border-radius:3px;transition:background .22s;cursor:pointer}
.sent:hover{background:rgba(232,184,75,.26)}
.sent.say{background:rgba(232,184,75,.6)}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:80;background:rgba(43,38,34,.92);
  color:#FFF7EC;font-size:12.5px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;
  display:flex;align-items:center;gap:10px}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* toast 本体不接事件（免得盖住底下的东西），只把里面的撤销按钮放出来 */
.tact{pointer-events:auto;border:none;background:rgba(232,184,75,.95);color:#4A3410;border-radius:999px;
  padding:3px 12px;font-size:12px;font-family:var(--sans);font-weight:600}
.tact:hover{background:var(--moon)}
#floatstop{position:fixed;right:16px;bottom:22px;z-index:70;display:none;border:none;background:rgba(43,38,34,.9);
  color:#FFF7EC;border-radius:999px;padding:10px 17px;font-size:12.5px;font-family:var(--sans);box-shadow:0 4px 14px rgba(43,38,34,.28)}
#floatstop.on{display:block}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:46px;font-family:var(--serif)}
</style>
</head>

<script>
var DATA = {
  "unit": 14,
  "stories": [
    {
      "id": "s1",
      "en": "The Sovereign's Stage",
      "zh": "君主的舞台",
      "theme": "人物 / 社会",
      "ps": [
        {
          "en": "When a [[sophisticated]] stranger arrived at the city gate, the old [[shelter]] by the river had long been home to people with nothing left to [[share]]. The [[sovereign]] of the region, known for a [[sharp]] wit and a sharper sword, watched the newcomer with quiet interest.",
          "zh": "当一位老练的陌生人来到城门时，河边的旧庇护所早已成了那些再无物可分享之人的归宿。这一地区的君主以机敏的才智和更锋利的剑闻名，正静静打量着这位来客。"
        },
        {
          "en": "The stranger began to [[perform]] each evening, and his [[performance]] soon became the only [[topic]] anyone cared to discuss. What he did was [[sow]] small doubts about the high [[toll]] the road demanded, and the [[tone]] of the marketplace shifted from fear to curiosity.",
          "zh": "陌生人每晚开始表演，而他的演出很快成了人们唯一关心的话题。他所做的，是在那条路索要的高昂代价上播下小小的疑问，市场的气氛也随之从恐惧转向好奇。"
        },
        {
          "en": "Over a long [[period]], the town's old orders began to [[perish]], yet a [[perpetual]] question would not leave them: why did fortune favour the few? The stranger's riddles [[perplex]] the council for months, until a visiting [[periodical]] printed the answer and the people finally understood.",
          "zh": "在很长一段时期里，小镇的旧秩序开始消亡，但一个永恒的问题始终萦绕不去：为何好运只眷顾少数人？陌生人的谜语让议会困惑了数月，直到一份来访的期刊把答案印了出来，人们才终于明白。"
        }
      ]
    },
    {
      "id": "s2",
      "en": "The Organic Experiment",
      "zh": "有机实验",
      "theme": "科技 / 环境",
      "ps": [
        {
          "en": "From the [[perspective]] of the small research [[organization]], the soil was either a gift or a grave. Some scientists were [[pessimistic]] about the harvest; others, more [[optimistic]], believed the [[optimum]] conditions were still within reach.",
          "zh": "从这家小型研究机构的视角看，土地要么是恩赐，要么是坟墓。一些科学家对收成感到悲观；另一些更为乐观的人则相信，最适宜的条件仍有可能达到。"
        },
        {
          "en": "The [[option]] to use chemical feed was [[optional]], so the team chose to [[organize]] a natural trial instead. They hoped to [[enhance]] the soil with [[organism|organism]]s and to [[enlarge]] the plot where [[organic]] crops could grow free of synthetic aid.",
          "zh": "使用化学肥料这一选项是可任选的，于是团队转而组织了一场自然试验。他们希望用微生物来增强土壤，并扩大那片能让有机作物在无合成助剂下生长的田地。"
        },
        {
          "en": "The work did more than feed them; it began to [[enlighten]] a weary public, and the old man would [[rake]] through the leaves to show how [[rare]] life could be when left alone. What started as a single seed had become a quiet argument for another way of living.",
          "zh": "这项工作不只是喂饱了他们；它开始启发疲惫的公众，而老人会耙开落叶，展示当任其自生自灭时，生命可以多么珍稀。始于一颗种子的事，最终成了一场关于另一种生活方式的静默辩论。"
        }
      ]
    },
    {
      "id": "s3",
      "en": "A Sensible Choice",
      "zh": "明智的选择",
      "theme": "教育 / 职场",
      "ps": [
        {
          "en": "Most visitors [[rarely]] stopped to think about the [[rate]] at which the old bridge was fading, or the strange [[ratio]] of stone to silence it held. A [[rational]] mind, however, could [[reach]] the same conclusion before the first crack appeared.",
          "zh": "多数访客很少停下来思考这座老桥消逝的速度，或它那石与静默之间奇特的比例。然而，一个理性的头脑能在第一道裂缝出现前就得出同样的结论。"

var WMAP = {};
DATA.words.forEach(function(x){ WMAP[x.w] = x; });

function uKey(k){ return "ws.u" + (DATA.unit || 1) + "." + k; }
function uMastKey(){ return "wowstory.u" + (DATA.unit || 1) + ".mast"; }

/* allZh 是「阅读习惯」不是单元数据：默认开（第一次背得先看懂），
   手动关掉后跨单元、跨会话都记住，所以存档键不带单元号 */
var state = { tab:"", story:0, allZh: localStorage.getItem("ws.zh") !== "0",
              scope: localStorage.getItem(uKey("scope")) === "cur" ? "cur" : "all",
              drill:0, flipped:false, q:"",
              /* 生词本自己的一套视图状态，和上面的 unit 状态各管各的 */
              vq:"", vdrill:0, vflipped:false, vmode:"list" };
var MAST = JSON.parse(localStorage.getItem(uMastKey()) || "{}");
function saveMast(){ localStorage.setItem(uMastKey(), JSON.stringify(MAST)); }
/* 读到哪一篇也要记住 —— 「自测范围=本篇」是跟着 state.story 走的，
   不记住故事的话，刷新后背的词池会悄悄换成第 1 篇 */
state.story = Math.max(0, Math.min(parseInt(localStorage.getItem(uKey("story")) || "0", 10) || 0,
                               DATA.stories.length - 1));
/* 自测词池：cur = 只考这一篇，all = 整个单元。
   两篇的词在 DATA.words 里恰好连续排列，但仍按 id 过滤，不依赖排列顺序 */
function drillPool(){
  if(state.scope === "all") return DATA.words;
  var st = DATA.stories[Math.max(0, Math.min(state.story, DATA.stories.length - 1))];
  return DATA.words.filter(function(x){ return x.s === st.id; });
}
/* 背到第几个词、考哪一篇、读哪一篇，三样一起存 —— 否则下次打开：
   进度显示 12/53，卡片却回到第 1 个词，两个数字打架 */
function saveDrill(){
  localStorage.setItem(uKey("drill"), String(state.drill));
  localStorage.setItem(uKey("scope"), state.scope);
  localStorage.setItem(uKey("story"), String(state.story));
}
state.drill = Math.max(0, Math.min(parseInt(localStorage.getItem(uKey("drill")) || "0", 10) || 0,
                               drillPool().length - 1));

/* ============ 生词本（你自己的词库，独立于 unit）============
   书里的词用「单词」当身份：MAST[w] 掌握度 / WMAP[w] 词条 / audio/<voice>/w/<w>.mp3。
   生词本一律用自生成的 id（v1、v2…）当身份，存储键统一 ws.vocab.*，
   音频也走独立目录 vw/ 与 vwz/ —— 所以哪怕你收的词和书里一模一样，
   两边仍是两条互不干扰的记录：各自的掌握度、各自的卡片、各自的音频。
   存储键不带单元号：生词本是你的，不属于某个 Unit，加单元切换后它也是同一份。 */
function vload(k, d){
  try{ var s = localStorage.getItem("ws.vocab." + k); return s === null ? d : JSON.parse(s); }
  catch(e){ return d; }
}
function vsave(k, v){ try{ localStorage.setItem("ws.vocab." + k, JSON.stringify(v)); }catch(e){} }
var VOCAB = vload("list", []);   /* [{id,w,ipa,pos,zh,note,src,t}] 数组顺序 = 加入顺序 */
var VMAST = vload("mast", {});   /* {id: 0|1|2} 生词本自己的掌握度，与 MAST 无关 */
var VSEQ  = vload("seq", 0);     /* 编号只增不减：删掉的不复用，避免旧存档串到新词上 */
function vsaveList(){ vsave("list", VOCAB); }
function vsaveMast(){ vsave("mast", VMAST); }
function vfind(id){
  for(var i = 0; i < VOCAB.length; i++){ if(VOCAB[i].id === id) return VOCAB[i]; }
  return null;
}
/* 查重按「词」不按 id：同一个词不重复收，返回已有的那条 */
function vhas(w){
  var k = String(w == null ? "" : w).trim().toLowerCase();
  if(!k) return null;
  for(var i = 0; i < VOCAB.length; i++){ if(VOCAB[i].w.toLowerCase() === k) return VOCAB[i]; }
  return null;
}
/* 新增。词已存在则直接返回它（dup=true 表示「早就收过」） */
function vadd(o){
  var w = String(o && o.w || "").trim();
  if(!w) return null;
  var ex = vhas(w);
  if(ex) return { id: ex.id, dup: true };
  var id = "v" + (++VSEQ);
  vsave("seq", VSEQ);
  VOCAB.push({ id:id, w:w,
               ipa:String(o.ipa||"").trim(), pos:String(o.pos||"").trim(),
               zh:String(o.zh||"").trim(), note:String(o.note||"").trim(),
               src:String(o.src||"").trim(), t:Date.now() });
  vsaveList();
  return { id:id, dup:false };
}
function vdel(id){
  for(var i = 0; i < VOCAB.length; i++){
    if(VOCAB[i].id !== id) continue;
    VOCAB.splice(i, 1); vsaveList();
    if(VMAST[id] !== undefined){ delete VMAST[id]; vsaveMast(); }
    return true;
  }
  return false;
}
/* 音频文件名规则必须与补音频脚本 _gen_vocab.py 一致（同一个 vfname） */
function vfname(w){
  var s = String(w == null ? "" : w).trim().toLowerCase()
            .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  return s || "x";
}
/* 生词音频走独立目录 —— 哪怕和书里同名，也是两个文件，不会互相覆盖 */
function srcVWord(w){ return AUD + TTS.en + "/vw/" + vfname(w) + ".mp3"; }
function srcVWordZh(w){ return AUD + "zh/vwz/" + vfname(w) + ".mp3"; }
/* 某个词补过音频没有：undefined 未探 / true 有 / false 确认缺。
   列表里据此标「待补音频」——生词的音频是事后补的，缺是正常状态不是错误 */
var VHAS = {};
function vprobe(x, cb){
  var f = vfname(x.w);
  if(VHAS[f] !== undefined){ cb(VHAS[f]); return; }
  var a = new Audio(), done = false;
  function fin(ok){
    if(done) return; done = true;
    a.removeAttribute("src"); try{ a.load(); }catch(e){}
    VHAS[f] = ok; cb(ok);
  }
  a.addEventListener("loadedmetadata", function(){ fin(true); });
  a.addEventListener("error", function(){ fin(false); });
  setTimeout(function(){ fin(false); }, 6000);
  try{ a.preload = "metadata"; a.src = srcVWord(x.w); a.load(); }catch(e){ fin(false); }
}
/* 背到第几个生词也记住（和 unit 的 ws.u1.drill 是两把不同的钥匙） */
state.vdrill = Math.max(0, Math.min(parseInt(localStorage.getItem("ws.vocab.drill") || "0", 10) || 0,
                                 Math.max(0, VOCAB.length - 1)));
function saveVDrill(){ try{ localStorage.setItem("ws.vocab.drill", String(state.vdrill)); }catch(e){} }
/* 用户输入要落进 HTML（属性值和 textarea 都要转义） */
function vesc(s){
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function vdate(t){
  var d = new Date(t || Date.now());
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

/* ---- 音源诊断 ----
   所有音频都是相对路径 audio/...，实体在「与本文件同级的 audio 文件夹」里。
   只要页面不是以真 URL（file:// 或 http://）打开，相对路径就取不到文件 ——
   这是「音频没找到」的头号原因。下面把实际请求的地址摊开，免得靠猜。 */
function absOf(rel){ try{ return new URL(rel, document.baseURI).href; }catch(e){ return rel; } }
function audWhy(rel){
  var p = location.protocol;
  if(p === "about:" || p === "blob:" || p === "data:")
    return { brief:"预览内嵌的页面取不到音频", full:"页面被内嵌预览（协议 " + p + "）打开，"
      + "相对路径无法解析到磁盘。请用浏览器直接打开本文件，或通过本地服务器访问：\n" + absOf(rel) };
  if(p === "file:")
    return { brief:"确认 audio 文件夹与本文件同级", full:"已请求：\n" + absOf(rel)
      + "\n若该路径下没有此文件，说明 audio 文件夹没和本文件放在一起。" };
  return { brief:"音频未取到", full:"已请求：\n" + absOf(rel) };
}
function audFail(rel){
  var w = audWhy(rel);
  try{ console.warn("[WowStory] 音频加载失败：" + rel + "\n" + w.full); }catch(e){}
  var h = document.getElementById("ttshint");
  if(h){ h.textContent = "⚠ 音频没找到"; h.classList.add("err"); h.title = w.full; }
  toast("音频没找到 · " + w.brief);
}
/* 生词的音频是事后补的，缺文件属于正常状态 —— 不报成「路径错了」，
   也别去污染控制条上那个给书里音频排障用的 #ttshint */
function audMiss(rel, label){
  try{ console.warn("[WowStory] 生词音频未生成：" + rel); }catch(e){}
  toast((label || "这个词") + " 还没补音频 · 去「本」里导出词表补一次");
}
/* 静默自检：探一次第一段音频，成功什么都不做，失败就把原因摆到控制条上 */
function audioSelfCheck(){
  if(!DATA || !DATA.stories || !DATA.stories.length) return;
  var rel = AUD + TTS.en + "/p" + DATA.stories[0].id + "-0.mp3";
  var a = new Audio(), settled = false;
  function ok(){ if(settled) return; settled = true; a.removeAttribute("src"); try{ a.load(); }catch(e){} }
  a.preload = "metadata";
  a.onloadedmetadata = ok;
  a.oncanplay = ok;
  a.onerror = function(){ if(settled) return; settled = true; audFail(rel); };
  a.src = rel;
  try{ a.load(); }catch(e){}
}

var SAY = { token: 0, hl: [], last: "", btn: null, audio: null, raf: null };
function clean(s){ return s.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, "$1"); }
/* 断句规则必须和音频生成脚本 _gen.py 一致：只按 . ! ? 断，不认分号；Dr. 这类缩写不算句末 */
var ABBR = /(^|[\s(])(Dr|Mr|Mrs|Ms|Prof|St|vs|etc|No|Jr|Sr)\./gi;
function splitSents(raw){
  var c = String(raw).replace(ABBR, function(_, a, b){ return a + b + "\u0001"; });
  return (c.match(/[^.!?]+[.!?]*\s*/g) || [c])
    .map(function(s){ return s.replace(/\u0001/g, ".").trim(); }).filter(Boolean);
}
function sents(raw){ return splitSents(clean(raw)); }
/* 只摘掉高亮，不动按钮状态 */
function purgeHL(){
  SAY.hl.forEach(function(s){ var n = document.querySelector(s); if(n) n.classList.remove("say"); });
  SAY.hl = [];
}
function clearHL(){
  purgeHL();
  Array.prototype.forEach.call(document.querySelectorAll(".spk.ing"), function(b){ b.classList.remove("ing"); });
}
/* 全局唯一的播放器：换源即中断上一段 */
function player(){
  if(!SAY.audio){ var a = new Audio(); a.preload = "auto"; SAY.audio = a; }
  return SAY.audio;
}
function stopSay(){
  SAY.token++;
  if(SAY.raf){ cancelAnimationFrame(SAY.raf); SAY.raf = null; }
  var a = SAY.audio;
  if(a){
    a.onended = null; a.onerror = null;
    try{ a.pause(); a.removeAttribute("src"); a.load(); }catch(e){}
  }
  clearHL();
  var f = document.getElementById("floatstop");
  if(f) f.classList.remove("on");
  var s = document.getElementById("stopbtn");
  if(s) s.style.display = "none";
}
function showStop(){
  var f = document.getElementById("floatstop");
  if(f) f.classList.add("on");
  var s = document.getElementById("stopbtn");
  if(s) s.style.display = "";
}
/* act（可选）给 toast 挂一个动作按钮，用来做「已做某事 · 撤销」——
   比弹确认框轻，也比直接做掉安全 */
function toast(m, act){
  var t = document.getElementById("toast");
  t.textContent = m;
  if(act && act.text){
    var b = document.createElement("button");
    b.type = "button"; b.className = "tact"; b.textContent = act.text;
    b.addEventListener("click", function(){
      clearTimeout(toast.t); t.classList.remove("on");
      if(typeof act.fn === "function") act.fn();
    }, { once:true });
    t.appendChild(b);
  }
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(function(){ t.classList.remove("on"); }, act ? 4600 : 1600);
}
/* ---- 播放核心：一个 <audio> 串起一串音源 ---- */
function markOn(sel){
  purgeHL();
  var n = document.querySelector(sel);
  if(n){ n.classList.add("say"); SAY.hl.push(sel); }
}
/* 段落播放：按时间轴推进高亮，并让高亮句自动滚进视野 */
function follow(key, my){
  var marks = (PT[TTS.en] || {})[key] || [];
  var k = +String(key).split("-")[1], cur = -1;
  (function tick(){
    if(my !== SAY.token) return;
    var a = SAY.audio;
    SAY.raf = requestAnimationFrame(tick);
    if(!a || a.paused) return;
    var t = a.currentTime, idx = 0;
    for(var j = 0; j < marks.length; j++){ if(t >= marks[j] - 0.15) idx = j; }
    if(idx === cur) return;
    cur = idx;
    var sel = selOf(k, idx);
    if(SAY.hl.indexOf(sel) >= 0) return;
    purgeHL();
    var n = document.querySelector(sel);
    if(!n) return;
    n.classList.add("say"); SAY.hl.push(sel);
    var r = n.getBoundingClientRect();
    if(r.top < 96 || r.bottom > window.innerHeight - 40){
      try{ n.scrollIntoView({ block:"center", behavior:"smooth" }); }catch(e){ n.scrollIntoView(); }
    }
  })();
}
/* 只播一条音频的 [from, to) —— 用来单读某一句 */
function playSlice(a, to, my){
  (function tick(){
    if(my !== SAY.token) return;
    if(a.currentTime >= to){ stopSay(); return; }
    SAY.raf = requestAnimationFrame(tick);
  })();
}
/* list 每项：{ src, from?, to?, key?, sel?, rate?, gap? } */
function playList(list, btn){
  if(TTS.mode === "off"){ toast("朗读已关闭 · 点顶部「🔊 朗读」打开"); return; }
  if(!list || !list.length) return;
  stopSay();
  var my = SAY.token;
  if(btn){ btn.classList.add("ing"); SAY.btn = btn; }
  showStop();
  var a = player(), i = 0;
  (function step(){
    if(my !== SAY.token) return;
    if(i >= list.length){ stopSay(); return; }
    var it = list[i++];
    var from = it.from || 0;
    function go(){
      if(my !== SAY.token) return;
      if(it.sel) markOn(it.sel);
      a.playbackRate = it.rate || TTS.rate;
      a.play().catch(function(){
        if(my !== SAY.token) return;
        toast("浏览器拦住了播放，点一下页面任意处再试");
        stopSay();
      });
      if(it.key) follow(it.key, my);
      else if(it.to) playSlice(a, it.to, my);
    }
    a.onended = function(){
      if(my !== SAY.token) return;
      if(SAY.raf){ cancelAnimationFrame(SAY.raf); SAY.raf = null; }
      purgeHL();
      setTimeout(function(){ if(my === SAY.token) step(); }, it.gap === undefined ? 110 : it.gap);
    };
    a.onerror = function(){
      if(my !== SAY.token) return;
      if(it.miss){ if(!it.quiet) audMiss(it.src, it.miss); } else audFail(it.src);
      stopSay();
    };
    if(from > 0){
      var once = function(){
        a.removeEventListener("loadedmetadata", once);
        if(my !== SAY.token) return;
        try{ a.currentTime = from; }catch(e){}
        go();
      };
      a.addEventListener("loadedmetadata", once);
      a.src = it.src; a.load();
    } else {
      a.src = it.src; a.load();
      go();
    }
  })();
}
/* 连读若干段：每段一条完整音频，段间留一点呼吸 */
function playParas(ks, btn){

/* 句子定位：段落 k 的第 j 句 */
function selOf(k, j){ return '[data-en="' + k + '"] .sent[data-si="' + j + '"]'; }
/* 只读某一段里的第 j 句：从整段音频里截取该句所在的时间窗 */
function speakSentence(k, j, btn){
  var st = DATA.stories[state.story];
  var marks = (PT[TTS.en] || {})[st.id + "-" + k] || [];
  if(j >= marks.length) return;
  var from = j > 0 ? Math.max(0, marks[j] - 0.25) : 0;
  var to = j + 1 < marks.length ? (marks[j + 1] + 0.10) : undefined;
  playList([{ src: srcPara(st.id, k), from: from, to: to, sel: selOf(k, j) }], btn);
}
function syncAudio(){
  var m = document.getElementById("modeseg"), r = document.getElementById("rateseg");
  if(m){
    Array.prototype.forEach.call(m.children, function(b){ b.classList.toggle("on", b.dataset.mode === TTS.mode); });
  }
  if(r){
    var rl = Array.prototype.slice.call(r.children), near = null, best = 9;
    rl.forEach(function(b){
      var d = Math.abs(parseFloat(b.dataset.rate) - TTS.rate);
      if(d < best){ best = d; near = b; }
    });
    if(near && best > 0.02){ TTS.rate = parseFloat(near.dataset.rate); saveTTS(); }
    rl.forEach(function(b){ b.classList.toggle("on", b === near); });
  }
  var vs = document.getElementById("voiceseg");
  if(vs){
    vs.innerHTML = VOICES.map(function(v){
      return '<button data-voice="' + v.id + '"' + (v.id === TTS.en ? ' class="on"' : "") + '>'
        + v.name + '<small>' + v.desc + '</small></button>';
    }).join("");

  var amode = document.getElementById("amode");
  if(amode) amode.textContent = TTS.mode === "off" ? "关" : (TTS.mode === "auto" ? "自动" : "手动");

  }
}

/* 背模式朗读：「听音」是背词的第一步，所以进卡自动读词（只有「关」档才静音）。
   「自动」档额外在翻面时读中文释义 + 例句；「手动」档翻面不读，留给用户自己回忆。 */
function autoDrill(){
  if(TTS.mode === "off" || state.tab !== "drill") return;
  var pool = drillPool();
  var x = pool[Math.min(state.drill, pool.length - 1)];
  var key = x.w + "|" + (state.flipped ? "f" : "n");
  if(SAY.last === key) return;
  SAY.last = key;
  if(!state.flipped){
    playList([{ src: srcWord(x.w) }], null);
  } else {
    /* 翻面揭晓：只要朗读没关，自动朗读中文释义；自动档额外朗读加分例句 */
    var items = [{ src: srcWordZh(x.w) }];

/* data-say 的取值：
   all 连读全篇 / p:N 读第 N 段英文 / pz:N 读第 N 段中文 / s:N:j 只读第 N 段的第 j 句
   w 单词 / slow 慢速单词 / wz 中文释义 / wb 词+释义+例句
   pat 加分句式 / patz 句式中文 / chip:词:序号 搭配短语
   生词本（一律传 id，不传单词 —— 这是两个命名空间）：vw 单词 / vslow 慢速 / vwz 释义 / vb 词+释义 */
function sayBy(key, btn){
  var a = key.split(":"), k = a[0], v = a.slice(1).join(":");
  var st = DATA.stories[state.story];
  if(k === "all"){ toast("连读全篇 · 共 " + st.ps.length + " 段"); playParas(st.ps.map(function(_, i){ return i; }), btn); }
  else if(k === "cards"){
    var storyWords = DATA.words.filter(function(x){ return x.s === st.id; });
    toast("顺读本篇考卡 · 共 " + storyWords.length + " 词");
    var items = [];
    storyWords.forEach(function(x){
      items.push({ src: srcWord(x.w), sel: '.wcard[data-w="' + x.w + '"]', gap: 280 });
      items.push({ src: srcWordZh(x.w), sel: '.wcard[data-w="' + x.w + '"]', gap: 380 });
    });
    playList(items, btn);
  }
  else if(k === "p"){ playParas([+v], btn); }
  else if(k === "s"){ var q = v.split(":"); speakSentence(+q[0], +q[1], btn); }
  else if(k === "pz"){ playList([{ src: srcParaZh(st.id, +v) }], btn); }
  else if(k === "w"){ if(WMAP[v]) playList([{ src: srcWord(v) }], btn); }
  else if(k === "slow"){ if(WMAP[v]) playList([{ src: srcWord(v), rate: 0.65 }], btn); }
  else if(k === "wz"){ if(WMAP[v]) playList([{ src: srcWordZh(v) }], btn); }
  else if(k === "wb"){ if(WMAP[v]) playList([
      { src: srcWord(v), gap: 320 },
      { src: srcWordZh(v), gap: 320 },
      { src: srcPat(v) }], btn); }
  else if(k === "pat"){ if(WMAP[v]) playList([{ src: srcPat(v) }], btn); }
  else if(k === "patz"){ if(WMAP[v]) playList([{ src: srcPatZh(v) }], btn); }
  else if(k === "chip"){ var cq = v.split(":"), cw = cq[0]; if(WMAP[cw] && WMAP[cw].c[+cq[1]]) playList([{ src: srcChip(cw, +cq[1]) }], btn); }
  /* ---- 生词本：传 id 不传单词，所以和书里同名也不会读错文件 ---- */
  else if(k === "vw" || k === "vslow"){
    var vx = vfind(v); if(!vx) return;
    playList([{ src: srcVWord(vx.w), rate: k === "vslow" ? 0.65 : undefined,
                miss: "「" + vx.w + "」" }], btn);
  }
  else if(k === "vwz"){
    var vxz = vfind(v); if(!vxz || !vxz.zh) return;
    playList([{ src: srcVWordZh(vxz.w), miss: "「" + vxz.w + "」的释义" }], btn);
  }
  else if(k === "vb"){
    var vxb = vfind(v); if(!vxb) return;
    var vlist = [{ src: srcVWord(vxb.w), gap: 320, miss: "「" + vxb.w + "」" }];
    if(vxb.zh) vlist.push({ src: srcVWordZh(vxb.w), gap: 320, miss: "「" + vxb.w + "」的释义" });
    playList(vlist, btn);
  }
}

  if(want){ var pop = document.getElementById("apop"); if(pop) pop.classList.remove("on"); }
}
window.addEventListener("scroll", syncSticky, {passive:true});

/* 只有切 tab 才回到顶部；翻面 / 评分 / 重来这类「原地操作」不能挪动视口 ——
   页面一跳，指针底下的元素就换了人，用户会以为卡片点不动 */
var RENDERED_TAB = null;
function render(){
  var app = document.getElementById("app");
  var t = state.tab;
  var tabChanged = (t !== RENDERED_TAB);
  RENDERED_TAB = t;
  stopSay();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.classList.toggle("on", b.dataset.tab === t);
  });
  if(t === "read") app.innerHTML = viewRead();
  else if(t === "drill") app.innerHTML = viewDrill();
  else if(t === "write") app.innerHTML = viewWrite();
  else if(t === "vocab") app.innerHTML = viewVocab();
  else app.innerHTML = viewIndex();
  if(t === "index"){ var s = document.getElementById("q"); if(s){ s.value = state.q; s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
  if(t === "vocab"){ vprobeAll(); }
  autoDrill();
  autoVDrill();
  if(tabChanged) window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  syncSticky();
}

function viewRead(){
  var st = DATA.stories[state.story];
  var sCnt = DATA.stories.length;
  var cols = (sCnt === 5) ? 5 : ((sCnt === 6) ? 3 : sCnt);
  var h = '<div class="label">选一篇开始读</div><div class="pick" style="grid-template-columns:repeat(' + cols + ',1fr)">';
  DATA.stories.forEach(function(s, i){
    var cnt = DATA.words.filter(function(x){ return x.s === s.id; }).length;
    h += '<button class="pickc' + (i === state.story ? ' on' : '') + '" data-act="story" data-i="' + i + '">'
      + '<b>' + s.en + '</b><span>' + s.zh + ' · ' + s.theme + ' · ' + cnt + ' 词</span></button>';
  });
  h += '</div>';
  h += '<div class="label">英文故事 · 点加粗的词看释义</div>';
  h += '<div class="storycard"><div class="tape"></div>';
  h += '<h2 class="stitle">' + st.en + '｜' + st.zh + '</h2>';
  h += '<div class="smeta">题材 ' + st.theme + '　·　点加粗词查看考点</div>';
  /* 控制条排在正文之前：译文开关是读的时候要随手按的，不该压到卡片最底下去够 */
  h += '<div class="toolbar top">'
    + '<button class="btn' + (state.allZh ? ' on' : '') + '" data-act="zh" title="中文译文随时开关，选择会一直记住">中文译文 · '
    + (state.allZh ? '开' : '关') + '</button>'
    + '<button class="btn" data-say="all" title="从第一段读到末尾，逐句高亮">🔊 连读全篇</button>'
    + '<button class="btn" data-act="todrill">拿这篇自测 →</button></div>';
  st.ps.forEach(function(p, k){
    h += '<div class="pz' + (state.allZh ? ' open' : '') + '" data-en="' + k + '">'
      + '<p class="en"><button class="spk" data-say="p:' + k + '" title="朗读本段英文，逐句高亮">🔊</button>' + renderEn(p.en, k) + '</p>'
      + '<p class="zh">' + p.zh + '<button class="spk" data-say="pz:' + k + '" title="朗读本段中文">🔊</button></p></div>';
  });
  h += '</div>';

  var storyWords = DATA.words.filter(function(x){ return x.s === st.id; });
  h += '<div class="dhead"><div class="label" style="margin:0">本篇考点卡 · 点开看完整搭配</div>'
    + '<button class="btn quiet" data-say="cards" title="顺读本篇所有考点词，逐卡高亮">🔊 顺读本篇 ' + storyWords.length + ' 词</button></div>'
    + '<div class="grid">';
  storyWords.forEach(function(x){
    h += wordCard(x);
  });
  h += '</div>';
  return h;
}

function wordCard(x){
  var m = MAST[x.w];
  var dot = m === 2 ? ' · <span style="color:#3B6D11">已认识</span>' : (m === 1 ? ' · <span style="color:#BA7517">待巩固</span>' : (m === 0 ? ' · <span style="color:#A32D2D">没记住</span>' : ''));
  return '<div class="wcard" data-act="open" data-w="' + x.w + '" tabindex="0">'
    + '<div class="wtop">'
    + '<div class="wtop-left"><b>' + x.w + '</b><i>/' + x.ipa + '/</i><u>' + x.pos + '</u></div>'
    + '<button class="spk" data-say="w:' + x.w + '" title="朗读单词" style="padding:1px 6px">🔊</button>'
    + '</div>'
    + '<div class="wsense">' + x.zh + '<span style="color:var(--ink3)">' + dot + '</span></div>'
    + '<div class="wcoll"><em>' + x.c[0] + '</em></div></div>';
}

function viewDrill(){
  var pool = drillPool();
  var st = DATA.stories[Math.max(0, Math.min(state.story, DATA.stories.length - 1))];
  var curN = DATA.words.filter(function(y){ return y.s === st.id; }).length;
  var done = pool.filter(function(x){ return MAST[x.w] !== undefined; }).length;
  var known = pool.filter(function(x){ return MAST[x.w] === 2; }).length;
  var i = Math.min(state.drill, pool.length - 1);
  var x = pool[i];
  var h = '<div class="dhead"><div class="label">遮住释义，想好了再点开</div>'
    /* 自测范围：默认只考「本篇」（词轨格子大、和这套词对得上），想整单元过一遍再切。
       切换要清掉位置 —— 两个词池的下标不是一回事 */
    + '<div class="aseg" id="scopeseg">'
    + '<button data-act="scope" data-v="cur"' + (state.scope === "cur" ? ' class="on"' : '')
    + ' title="只自测本篇《' + st.zh + '》的 ' + curN + ' 个词">本篇 ' + curN + '</button>'
    + '<button data-act="scope" data-v="all"' + (state.scope === "all" ? ' class="on"' : '')
    + ' title="整个单元 ' + DATA.words.length + ' 个词一起过">全单元 ' + DATA.words.length + '</button>'
    + '</div></div>';
  /* 词轨 = 词表本身：位置、进度、掌握度、跳转，同一根元素上说完 */
  h += '<div class="prog">'
    + '<div class="ptop"><span>第 <b>' + (i + 1) + '</b> / ' + pool.length + ' 个</span>'
    + '<span>已评 <b>' + done + '</b> · 认识 <b>' + known + '</b></span></div>'
    + '<div class="track" id="track" tabindex="0" role="slider" aria-label="跳到任意词"'
    + ' aria-valuemin="1" aria-valuemax="' + pool.length + '" aria-valuenow="' + (i + 1) + '"'
    + ' title="点或拖动跳到任意词　灰=未背 红=没记住 黄=待巩固 绿=认识">'
    + pool.map(function(w, k){
        var m = MAST[w.w];
        return '<i data-i="' + k + '" class="' + (m === undefined ? 'u' : 'm' + m) + (k === i ? ' cur' : '') + '"></i>';
      }).join('')
    + '<span class="tip" id="ptip"></span></div>';
  h += '<div class="flip" data-act="flip">';
  h += '<div><span class="fpos">' + x.pos + '</span></div>';
  h += '<div class="fword">' + x.w + '</div>';
  h += '<div class="fipa">/' + x.ipa + '/</div>';
  h += '<div style="margin-top:12px">'
    + '<button class="spk" data-say="w:' + x.w + '" title="重听这个单词">🔊 听词</button>'
    + '<button class="spk" data-say="slow:' + x.w + '" title="慢速重读">🐢 慢速</button></div>';
  if(state.flipped){
    h += '<div class="reveal">'
      + '<div class="rline"><span>故事义</span><span>' + x.zh + '<button class="spk" data-say="wz:' + x.w + '" title="朗读中文释义">🔊</button></span></div>'
      + '<div class="rline"><span>常考义</span><span>' + x.exam + '</span></div>'
      + '<div class="rline"><span>搭配</span><span>' + x.c.slice(0,2).map(function(c){return '<em>' + c + '</em>';}).join('　·　') + '</span></div>'
      + '<div class="rline"><span>近义</span><span>' + x.syn.join(' · ') + '</span></div>'
      + '<div style="margin-top:8px"><button class="spk" data-say="wb:' + x.w + '" title="词 + 释义 + 例句 连读">🔊 词 + 释义 + 例句</button></div>'
      + '</div>';
  } else {
    h += '<div class="hint" id="cardhint">' + cardHintText() + '</div>';
  }
  h += '<div class="cardfoot"><button class="more" data-act="open" data-w="' + x.w + '"'
    + ' title="打开这张卡的全部考点：搭配 / 近义 / 词族 / 辨析 / 句式">完整考点 →</button></div>';
  h += '</div>';
  if(state.flipped){
    h += '<div class="drillbar">'
      + '<button class="btn b-no" data-act="mark" data-v="0">没记住</button>'
      + '<button class="btn b-mid" data-act="mark" data-v="1">待巩固</button>'
      + '<button class="btn b-ok" data-act="mark" data-v="2">认识</button>'
      + '</div>';
  }
  h += '<div class="toolbar" style="justify-content:center;margin-top:14px">'
    + '<button class="btn quiet" data-act="reset" title="清空全部掌握度，从头开始">↺ 重新来过</button></div>';
  return h;
}

function viewWrite(){
  var q = state.q.trim().toLowerCase();
  var pool = DATA.words.filter(function(x){
    if(!q) return true;
    var blob = [x.w, x.pat, x.patZh, x.c.join(" "), x.zh].join(" ").toLowerCase();
    return blob.indexOf(q) >= 0;
  });
  var h = '<div class="label">把 ' + DATA.words.length + ' 个词的作文句型抽出来，直接背走</div>';
  h += '<input class="search" id="q" placeholder="搜词 / 搜中文，例如：证明 / obtain / 由于" value="' + state.q.replace(/"/g,'&quot;') + '">';
  if(!pool.length){ return h + '<div class="hint" style="text-align:center;padding:40px 0">没找到，换个词试试</div>'; }
  pool.forEach(function(x){
    h += '<div class="pat"><p class="pen">' + x.pat.replace(new RegExp('\\b' + x.w + '\\w*', 'i'), function(m){ return '<span class="tw on" data-w="' + x.w + '">' + m + '</span>'; }) + '</p>'
      + '<p class="pzh">' + x.patZh + '</p>'
      + '<div class="pfor">来自 ' + x.w + '　/' + x.ipa + '/　' + x.pos + '</div>'
      + '<div class="toolbar" style="margin-top:11px;gap:6px">'
      +   '<button class="spk" data-say="pat:' + x.w + '" title="朗读整句例句">🔊 整句</button>'
      +   '<button class="spk" data-say="patz:' + x.w + '" title="朗读这句的中文">🔊 中文</button>'
      +   '<button class="spk" data-say="w:' + x.w + '" title="单独读这个词">🔊 ' + x.w + '</button>'
      +   '<button class="spk" data-say="slow:' + x.w + '" title="慢速重读，便于跟读">🐢 慢速</button>'
      + '</div>'
      + '<div class="chips">' + x.c.map(function(c, i){ return '<button class="chip" data-say="chip:' + x.w + ':' + i + '" title="朗读这条搭配">' + c + '</button>'; }).join('') + '</div>'
      + '</div>';
  });
  return h;
}

function viewIndex(){
  var q = state.q.trim().toLowerCase();
  var pool = DATA.words.filter(function(x){
    if(!q) return true;
    return (x.w + " " + x.zh + " " + x.exam + " " + x.c.join(" ")).toLowerCase().indexOf(q) >= 0;
  });
  var h = '<div class="label">' + DATA.words.length + ' 词速查 · 点任意一行看完整考点</div>';
  h += '<input class="search" id="q" placeholder="搜单词 / 中文释义 / 搭配" value="' + state.q.replace(/"/g,'&quot;') + '">';
  h += '<table><thead><tr><th style="width:22%">词</th><th style="width:26%">故事义</th><th>必背搭配</th></tr></thead><tbody>';
  pool.forEach(function(x){
    h += '<tr data-act="open" data-w="' + x.w + '">'
      + '<td class="w">' + x.w + '<button class="spk" data-say="w:' + x.w + '" title="朗读这个单词">🔊</button>'
      + '<div style="font-weight:400;color:var(--ink3);font-size:11px">/' + x.ipa + '/</div></td>'
      + '<td class="c">' + x.zh + '</td>'
      + '<td class="c">' + x.c[0] + '</td></tr>';
  });
  h += '</tbody></table>';
  if(!pool.length) h += '<div class="hint" style="text-align:center;padding:30px 0">没找到，换个词试试</div>';
  return h;
}

/* ==================== 生词本：视图 ==================== */
function vrated(){ return VOCAB.filter(function(x){ return VMAST[x.id] !== undefined; }).length; }
function vnmiss(){ return VOCAB.filter(function(x){ return VHAS[vfname(x.w)] === false; }).length; }
function vstatTag(id){
  var m = VMAST[id];
  if(m === 2) return '<span class="vstat m2">已认识</span>';
  if(m === 1) return '<span class="vstat m1">待巩固</span>';
  if(m === 0) return '<span class="vstat m0">没记住</span>';
  return '<span class="vstat">未背</span>';
}
/* 音频状态：缺音频时它是个可点的「补音频」按钮，有音频时退化成纯文字 */
function vaudioTag(x){
  var s = VHAS[vfname(x.w)];
  var cls = s === true ? "vstat ok" : s === false ? "vstat vo" : "vstat";
  return '<button class="' + cls + '" data-vaudio="' + x.id + '"'
    + (s === false ? ' data-act="vgen1" data-id="' + x.id + '" title="点一下给这个词补发音"' : '')
    + '>' + (s === true ? "可朗读" : s === false ? "补音频" : "") + '</button>';
}
function vtagAudio(id, ok){
  var el = document.querySelector('[data-vaudio="' + id + '"]');
  if(el){
    var busy = el.classList.contains("busy");
    el.className = "vstat " + (ok ? "ok" : "vo") + (busy ? " busy" : "");
    el.textContent = ok ? "可朗读" : "补音频";
    if(ok){
      el.removeAttribute("data-act"); el.removeAttribute("data-id"); el.removeAttribute("title");
    } else {
      el.setAttribute("data-act", "vgen1"); el.setAttribute("data-id", id);
      el.setAttribute("title", "点一下给这个词补发音");
    }
  }
  var n = document.getElementById("vmissN");
  if(n) n.textContent = String(vnmiss());
  var wn = document.getElementById("vwarnN");
  if(wn) wn.style.display = vnmiss() ? "" : "none";
}
/* 音频有没有是异步探出来的，渲染时先占位，探到再就地填 —— 不整页重渲染，免得打断操作 */
function vprobeAll(cb){
  var left = VOCAB.length;
  if(!left){ if(cb) cb(); return; }
  VOCAB.forEach(function(x){
    vprobe(x, function(ok){
      vtagAudio(x.id, ok);
      vmissTick();
      if(--left <= 0 && cb) cb();
    });
  });
}
function viewVocab(){ return state.vmode === "drill" ? vocabDrill() : vocabList(); }

function vocabList(){
  var q = String(state.vq || "").trim().toLowerCase();
  var pool = VOCAB.filter(function(x){
    if(!q) return true;
    return [x.w, x.zh, x.note, x.src, x.pos].join(" ").toLowerCase().indexOf(q) >= 0;
  });
  var h = '<div class="vhead"><div class="label">我的生词本</div>'
    + '<div class="vc"><b>' + VOCAB.length + '</b> 个词'
    + '<span id="vwarnN"' + (vnmiss() ? '' : ' style="display:none"') + '>　·　待补音频 <b id="vmissN">' + vnmiss() + '</b></span>'
    + '</div></div>';
  if(!VOCAB.length){
    return h + '<div class="vempty"><b>还没有生词</b>'
      + '做阅读碰到的、背单词总记不住的，都可以丢进来。<br>'
      + '它和书里的词<b>分开存放</b>：哪怕收了同一个词，两边的掌握度和音频也各算各的。'
      + '<div class="vdrop"><button class="btn" data-act="vnew">＋ 添加第一个生词</button></div></div>';
  }
  h += '<div class="vdrop">'
    + '<button class="btn" data-act="vnew">＋ 添加生词</button>'
    + '<button class="btn on" data-act="vstart">开始自测（' + VOCAB.length + '）</button>'
    + '<button class="btn quiet" data-act="vexport">补音频</button>'
    + '</div>';
  if(VOCAB.length > 5){
    h += '<div style="margin-top:16px"><input class="search" id="vq" placeholder="搜单词 / 释义 / 笔记 / 出处" value="'
      + vesc(state.vq) + '"></div>';
  }
  if(!pool.length){
    return h + '<div class="hint" style="text-align:center;padding:40px 0">没找到，换个词试试</div>';
  }
  h += '<div style="margin-top:12px">';
  pool.forEach(function(x){
    h += '<div class="vrow">'
      + '<div class="vw">' + vesc(x.w)
      +   (x.ipa ? '<i>/' + vesc(x.ipa) + '/</i>' : '')
      +   (x.pos ? '<u>' + vesc(x.pos) + '</u>' : '')
      + '</div>'
      + (x.zh ? '<div class="vz">' + vesc(x.zh) + '</div>' : '')
      + (x.note ? '<div class="vn">' + vesc(x.note) + '</div>' : '')
      + '<div class="vf">' + vstatTag(x.id)
      +   vaudioTag(x)
      +   '<span class="vsrc">' + vesc(x.src || ('加入于 ' + vdate(x.t))) + '</span>'
      +   '<span class="vacts">'
      +     '<button class="spk" data-say="vw:' + x.id + '" title="读这个词（没补过音频会提示）">🔊 读</button>'
      +     '<button class="spk" data-act="vedit" data-id="' + x.id + '">改</button>'
      +     '<button class="spk" data-act="vdel" data-id="' + x.id + '">删</button>'
      +   '</span>'
      + '</div></div>';
  });
  return h + '</div>';
}

/* 生词自测：样式全复用背模式那套（.flip / .track / .drillbar），
   但数据从头到尾只认 VOCAB 和 VMAST —— 这是两套词池，不是一个词池的两种筛选 */
function vocabDrill(){
  var pool = VOCAB, i = Math.max(0, Math.min(state.vdrill, pool.length - 1));
  var x = pool[i];
  var known = VOCAB.filter(function(y){ return VMAST[y.id] === 2; }).length;
  var h = '<div class="dhead"><div class="label">生词自测 · 遮住释义，想好了再点开</div>'
    + '<div class="aseg"><button data-act="vback">← 回列表</button></div></div>';
  h += '<div class="prog">'
    + '<div class="ptop"><span>第 <b>' + (i + 1) + '</b> / ' + pool.length + ' 个</span>'
    + '<span>已背 <b>' + vrated() + '</b> · 认识 <b>' + known + '</b></span></div>'
    + '<div class="track" id="vtrack" tabindex="0" role="slider" aria-label="跳到任意生词"'
    + ' aria-valuemin="1" aria-valuemax="' + pool.length + '" aria-valuenow="' + (i + 1) + '"'
    + ' title="点或拖动跳到任意词　灰=未背 红=没记住 黄=待巩固 绿=认识">'
    + pool.map(function(y, k){
        var m = VMAST[y.id];
        return '<i data-i="' + k + '" class="' + (m === undefined ? 'u' : 'm' + m) + (k === i ? ' cur' : '') + '"></i>';
      }).join('')
    + '<span class="tip" id="vtip"></span></div>';
  h += '<div class="flip" data-act="vflip">';
  h += '<div><span class="fpos">' + (x.pos ? vesc(x.pos) : '生词') + '</span></div>';
  h += '<div class="fword">' + vesc(x.w) + '</div>';
  if(x.ipa) h += '<div class="fipa">/' + vesc(x.ipa) + '/</div>';
  h += '<div style="margin-top:12px">'
    + '<button class="spk" data-say="vw:' + x.id + '" title="重听这个生词">🔊 听词</button>'
    + '<button class="spk" data-say="vslow:' + x.id + '" title="慢速重读">🐢 慢速</button></div>';
  if(state.vflipped){
    h += '<div class="reveal">'
      + '<div class="rline"><span>释义</span><span>'
      +   (x.zh ? vesc(x.zh) + '<button class="spk" data-say="vwz:' + x.id + '" title="朗读释义">🔊</button>'
              : '<span style="color:var(--ink3)">这条没填释义</span>')
      + '</span></div>';
    if(x.note) h += '<div class="rline"><span>笔记</span><span>' + vesc(x.note) + '</span></div>';
    if(x.src) h += '<div class="rline"><span>出处</span><span>' + vesc(x.src) + '</span></div>';
    h += '<div class="rline"><span>加入</span><span style="color:var(--ink2)">' + vdate(x.t) + '</span></div>'
      + '<div style="margin-top:8px"><button class="spk" data-say="vb:' + x.id + '" title="词 + 释义 连读">🔊 词 + 释义</button></div>'
      + '</div>';
  } else {
    h += '<div class="hint" id="cardhint">' + (TTS.mode === "off"
      ? '先在心里说出意思，再点一下卡片揭晓'
      : '先听音、在心里说出意思，再点一下卡片揭晓') + '</div>';
  }
  h += '<div class="cardfoot"><button class="more" data-act="vedit" data-id="' + x.id + '"'
    + ' title="释义 / 音标 / 笔记写错了，就地改">编辑这条 →</button></div>';
  h += '</div>';
  if(state.vflipped){
    h += '<div class="drillbar">'
      + '<button class="btn b-no" data-act="vmark" data-v="0">没记住</button>'
      + '<button class="btn b-mid" data-act="vmark" data-v="1">待巩固</button>'
      + '<button class="btn b-ok" data-act="vmark" data-v="2">认识</button>'
      + '</div>';
  }
  h += '<div class="toolbar" style="justify-content:center;margin-top:14px">'
    + '<button class="btn quiet" data-act="vreset" title="清空生词本的掌握度（书里的不动）">↺ 重新来过</button></div>';
  return h;
}

/* 生词自测进卡自动读词：和背模式同一条规则，只是换了词源。
   缺音频时静默 —— 自测是连着过的，不能每换一张卡就弹一次提示 */
function autoVDrill(){
  if(TTS.mode === "off" || state.tab !== "vocab" || state.vmode !== "drill") return;
  var pool = VOCAB; if(!pool.length) return;
  var x = pool[Math.max(0, Math.min(state.vdrill, pool.length - 1))];
  if(!x) return;
  var key = "v" + x.id + "|" + (state.vflipped ? "f" : "n");
  if(SAY.last === key) return;
  SAY.last = key;
  if(state.vflipped)
    playList([{ src: srcVWordZh(x.w), gap: 320, miss: "「" + x.w + "」的释义", quiet: true }], null);
  else
    playList([{ src: srcVWord(x.w), miss: "「" + x.w + "」", quiet: true }], null);
}

function vexportData(){

/* ---------- 和本地服务器对话 ----------
   页面经 http 打开时 serve.py 就在旁边，能直接生成音频；经 file:// 打开时没有
   服务器，这条路自动退回「导出词表 + 手动跑 _gen_vocab.py」。两种情形都留着出口，
   不让人卡在「点了没反应」上。 */
var VAPI = { state: "unknown", info: null };   /* unknown/probing/ready/setup/nogen/nowrite/noserver/nofile */
var VJOB = { id: null, timer: null, data: null, t0: 0, setup: false };

function vapiOK(){ return location.protocol === "http:" || location.protocol === "https:"; }
function vapi(path, opt){
  opt = opt || {};
  var h = { "X-WowStory": "1" };      /* 这个自定义头会让跨站请求被浏览器拦掉 */
  if(opt.body) h["Content-Type"] = "application/json";
  return fetch(path, { method: opt.method || "GET", headers: h, cache: "no-store",
                       body: opt.body ? JSON.stringify(opt.body) : undefined })
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ j.__status = r.status; return j; });
    });
}
function vapiPing(cb, tries){
  tries = tries || 0;
  if(!vapiOK()){ VAPI.state = "nofile"; cb(); return; }
  vapi("/api/ping").then(function(j){
    if(!j || !j.ok){ VAPI.state = "noserver"; cb(); return; }
    VAPI.info = j;
    if(j.write === false){ VAPI.state = "nowrite"; cb(); return; }
    if(j.gen && j.gen.available){ VAPI.state = "ready"; cb(); return; }
    if(j.gen && j.gen.probe === "pending" && tries < 10){   /* 服务在后台探解释器，等它一下 */
      VAPI.state = "probing";
      setTimeout(function(){ vapiPing(cb, tries + 1); }, 700);
      cb(); return;
    }
    VAPI.state = (j.gen && j.gen.canSetup) ? "setup" : "nogen";
    cb();
  }).catch(function(){ VAPI.state = "noserver"; cb(); });
}
/* 生词只补「当前音色 + 中文」：切到别的音色时那一套缺了再补一次就行 */
function vgenItems(only){
  return (only ? [only] : VOCAB).map(function(x){
    return { w: x.w, f: vfname(x.w), zh: x.zh || "" };
  });
}
function vcanAuto(){
  if(!vapiOK()){ toast("页面是用文件打开的，没有服务器可调"); return false; }
  if(VAPI.state === "ready") return true;
  if(VAPI.state === "setup"){ toast("先点「准备朗读引擎」装一次"); return false; }
  if(VAPI.state === "unknown" || VAPI.state === "probing"){ toast("还在检查本地服务器，再点一次"); return false; }
  toast("连不上本地服务器 · 重启 serve.cmd 即可");
  return false;
}
/* 要动服务器了，但状态还不确定：先探一次，探通了再干，探不通就把面板打开讲清原因 */
function vwithApi(fn){
  if(VAPI.state === "ready"){ fn(); return; }
  if(VAPI.state === "unknown" || VAPI.state === "probing"){
    vapiPing(function(){ if(VAPI.state === "ready") fn(); else openVocabExport(); });
    return;
  }
  openVocabExport();
}

function vnoReason(){
  var st = VAPI.state, i = VAPI.info || {};

    return '这个页面是<b>用文件直接打开</b>的，旁边没有服务器，所以点不出自动生成。'
         + '用 <code>serve.cmd</code> 打开就能一键补了。下面的手动方式照样可用。';
  if(st === "nowrite")
    return '服务器是 <b>--lan 模式</b>启动的，写接口默认关着（怕同 WiFi 下别的设备往你硬盘写东西）。'
         + '要用就加 <code>--allow-write</code> 重启。';
  if(st === "nogen")
    return '服务器在跑，但机器上找不到装了 <code>edge-tts</code> 的 python，也没法自动安装。'
         + '照着下面的手动方式装一次就好。';
  if(st === "noserver")
    return '连不上本地服务器。可能 <code>serve.py</code> 没在跑，也可能你是在<b>内置预览面板</b>里打开的这个页面'
         + '（那里也是一个 http 地址，但不是 serve.py 提供的，所以调不到接口）。'
         + '用 <code>serve.cmd</code> 打开，或直接访问 <code>http://127.0.0.1:8899/Unit01.html</code> 就行。'
         + '下面的手动方式不需要服务器。';
  return '没法自动生成。';
}
/* 面板骨架：状态区 + 进度/结果 + 待补清单 + 手动方式（自动可用时收进折叠里） */
function openVocabExport(){
  stopSay();
  document.getElementById("sheetBody").innerHTML =
      '<div class="sh-word">补音频<i>' + VOCAB.length + ' 个词</i></div>'
    + '<div class="vgn" id="gbox"><div class="gstate" id="gstate">正在问本地服务器…</div></div>'
    + '<div class="vres" id="gres" style="display:none"></div>'

    + '<div id="gfall"></div>';

  document.getElementById("sheet").classList.add("on");

function vpaintGen(){
  var box = document.getElementById("gbox"); if(!box) return;
  if(VJOB.id){                                   /* 有任务在跑：只显示进度，别给别的按钮 */
    box.innerHTML = '<div class="gstate" id="gstate">正在准备…</div>'
      + '<div class="gbar"><i id="gbar" style="width:0%"></i></div>'
      + '<div class="gnum"><span id="gnum">0 / 0</span><span id="gtime">0 秒</span></div>';
    vjobPaint();
    return;
  }
  var st = VAPI.state, miss = vnmiss();
  var h;
  if(st === "ready"){
    h = '<div class="gstate" id="gstate">'
      + (miss ? '还有 ' + vmissLine() + ' 个词没音频。' : '生词的音频都齐了。')
      + ' 点一下就在这台机器上生成：<b>当前音色 ' + TTS.en + ' + 中文读音</b>，'
      + '已经补过的会自动跳过。从书里收进来的词，英文和中文都能直接从书里复用，不用重新合成。'
      + '</div>'
      + '<div class="toolbar" style="margin-top:13px">'
      +   '<button class="btn on" data-act="vgenall">⚡ 一键补音频</button>'
      +   '<button class="btn quiet" data-act="vprobe">重新检查</button>'
      +   '<button class="btn quiet" data-act="vsaveclose">关闭</button>'
      + '</div>';
  } else if(st === "probing" || st === "unknown"){
    h = '<div class="gstate" id="gstate">正在检查这台机器的朗读引擎…</div>';
  } else if(st === "setup"){
    h = '<div class="gstate" id="gstate">这台机器上还没有能生成发音的组件（<code>edge-tts</code>）。'
      + '点下面这颗按钮自动准备一次 —— 装在本项目里的 <code>.ttsenv</code>，不动你系统的 python，约 30 秒。'
      + '装完就能一键补音频了。</div>'
      + '<div class="toolbar" style="margin-top:13px">'
      +   '<button class="btn on" data-act="vsetup">准备朗读引擎</button>'
      +   '<button class="btn quiet" data-act="vsaveclose">先不用</button>'
      + '</div>';
  } else {
    h = '<div class="gstate warn" id="gstate">' + vnoReason() + '</div>'
      + '<div class="toolbar" style="margin-top:13px">'
      +   '<button class="btn quiet" data-act="vping">再试一次</button>'
      +   '<button class="btn quiet" data-act="vsaveclose">知道了</button>'

  }
